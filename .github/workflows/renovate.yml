name: Renovate

on:
  schedule:
    # Daily at 04:17 UTC
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write       # push update branches
  pull-requests: write  # open and update PRs
  issues: write         # Dependency Dashboard issue

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: 'required'
          LOG_LEVEL: info
