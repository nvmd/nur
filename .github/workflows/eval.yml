name: Evaluate flake

# verifies the flake evaluates (`nix flake check --no-build`)
# without building or running any `checks` derivation.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      systems:
        description: >-
          JSON array of systems to evaluate, overriding the built-in default
          (e.g. '["x86_64-linux","aarch64-linux"]').
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: "nix flake check --no-build (${{ matrix.system }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # dispatch input if non-empty, else the default
        system: ${{ fromJSON(inputs.systems || '["x86_64-linux","aarch64-darwin"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nix
        uses: ./.github/actions/setup-nix-action
      - name: Evaluate ${{ matrix.system }}
        run: nix flake check --no-build --show-trace --system ${{ matrix.system }}
